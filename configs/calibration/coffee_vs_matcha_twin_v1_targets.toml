description = "Model-generated targets for testing calibration (not data)."
source = "halibut make-targets from coffee_vs_matcha_twin_v1 at the [truth] point, seeds [9000, 9001, 9002, 9003, 9004, 9005, 9006, 9007, 9008, 9009]"

