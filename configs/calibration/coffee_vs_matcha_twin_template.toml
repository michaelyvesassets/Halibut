# Moment definitions for the coffee_vs_matcha twin experiment (no values).
# `halibut make-targets` fills in SYNTHETIC values generated by the model.
# Weeks refer to the 52-week horizon of coffee_vs_matcha_v1.

schema_version = "1.0"

[targets]
name = "coffee_vs_matcha_twin_v1"
kind = "synthetic"
description = "Model-generated targets for testing calibration (not data)."
source = "template"

[[moments]]
name = "matcha_share_midyear"
type = "window_mean"
metric = "purchase_share_matcha"
start_week = 24
end_week = 28

[[moments]]
name = "matcha_share_end"
type = "window_mean"
metric = "purchase_share_matcha"
start_week = 48
end_week = 52

[[moments]]
name = "matcha_adoption_end"
type = "window_mean"
metric = "adoption_share_matcha"
start_week = 48
end_week = 52

[[moments]]
name = "no_purchase_rate_end"
type = "window_mean"
metric = "no_purchase_rate"
start_week = 48
end_week = 52

[[moments]]
name = "switching_rate"
type = "window_mean"
metric = "switching_rate"
start_week = 26
end_week = 52

[[moments]]
name = "matcha_own_price_elasticity"
type = "elasticity"
product = "matcha"
price_of = "matcha"
start_week = 40
end_week = 52

[[moments]]
name = "coffee_own_price_elasticity"
type = "elasticity"
product = "coffee"
price_of = "coffee"
start_week = 40
end_week = 52

[[moments]]
name = "coffee_cross_elasticity_wrt_matcha_price"
type = "elasticity"
product = "coffee"
price_of = "matcha"
start_week = 40
end_week = 52

# Held out from fitting: does the calibrated model predict intervention effects?
[[moments]]
name = "price_war_effect_matcha_share"
type = "effect"
role = "holdout"
scenario = "price_war"
metric = "purchase_share_matcha"
start_week = 40
end_week = 52

[[moments]]
name = "distribution_push_effect_matcha_share"
type = "effect"
role = "holdout"
scenario = "distribution_push"
metric = "purchase_share_matcha"
start_week = 40
end_week = 52
