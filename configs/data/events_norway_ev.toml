[[events]]
id = "no_charging_infrastructure_gap"
category = "infrastructure"
title = "Charging infrastructure expansion: NOT yet measured"
effective_date = "2024-01-01"
status = "data_gap"
verification = "secondary"
observed = "SSB table 14725 covers public charging points only for 2024–2025 (with a note on incomplete operator reporting to NOBIL). NOBIL's API requires a key; its licence is reported as CC BY (3.0 or 4.0, unconfirmed)."
assumed_effect = "Charging availability plausibly matters for adoption, but no historical series is ingested, so its effect cannot be estimated yet."
sources = ["https://www.ssb.no/en/statbank1/table/14725/",
           "https://wiki.openstreetmap.org/wiki/EV_charging_stations_in_Norway"]
