         "ssb_12906_private_cars_regional:TypeRegistrering=N:DrivstoffType=16", "ssb_12906_private_cars_regional:TypeRegistrering=N:DrivstoffType=17"]

[[consistency]]
name = "used_import_private_cars_total_14020_vs_12906"
geo = "NO"
tolerance_rel = 0.02
left = ["ssb_14020_private_cars:TypeRegistrering=B:DrivstoffType=19", "ssb_14020_private_cars:TypeRegistrering=B:DrivstoffType=20",
        "ssb_14020_private_cars:TypeRegistrering=B:DrivstoffType=21", "ssb_14020_private_cars:TypeRegistrering=B:DrivstoffType=6"]
right = ["ssb_12906_private_cars_regional:TypeRegistrering=B:DrivstoffType=1", "ssb_12906_private_cars_regional:TypeRegistrering=B:DrivstoffType=2",
         "ssb_12906_private_cars_regional:TypeRegistrering=B:DrivstoffType=3", "ssb_12906_private_cars_regional:TypeRegistrering=B:DrivstoffType=4",
         "ssb_12906_private_cars_regional:TypeRegistrering=B:DrivstoffType=5", "ssb_12906_private_cars_regional:TypeRegistrering=B:DrivstoffType=13",
