# Task-class model routing for the R2 intelligence loop (no secrets; approval lives in the provider config).
# One investigation makes at most one call per role: 3 LLM calls (the Investigator is merged into the
# Hypothesis Generator; model design is deterministic from the generator's model request).
# A role may override the model; providers and their spend guards are shared per model.
schema_version = "1.0"
provider_config = "configs/llm/anthropic.toml"
default_model = "claude-haiku-5-5"

[roles.hypothesis_generator]
# 6 hypotheses at their schema length limits need ~12k output tokens; a lower cap risks truncation (benchmark F4)
max_output_tokens = 12000

[roles.loop_critic]
# up to 3 critiques x 6 hypotheses (~2.2k tokens at the schema limits)
max_output_tokens = 3000

[roles.strategist]
# up to 4 options (~3.5k tokens at the schema limits)
max_output_tokens = 5000
