[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "halibut"
dynamic = ["version"]
description = "Halibut AI - synthetic market simulation engine (Phase 1)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
halibut = "halibut.cli:main"

[tool.setuptools.dynamic]
version = { attr = "halibut.version.ENGINE_VERSION" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
